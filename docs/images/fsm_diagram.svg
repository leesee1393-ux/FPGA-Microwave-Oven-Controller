<text x="91" y="789" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="13" font-weight="700" fill="#246775" text-anchor="start">INDEPENDENT FUNCTION</text>
<text x="91" y="816" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="16" font-weight="500" fill="#253342" text-anchor="start">SW → Servo PWM (50 Hz) → Door OPEN / CLOSE · Not connected to countdown state or safety interlock</text>
