<text x="97" y="682" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="16" font-weight="500" fill="#657383" text-anchor="start">KEY toggles time-setting independently of timer run.</text>
<text x="97" y="705" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="15" font-weight="500" fill="#657383" text-anchor="start">Top ties pause input to 0 (no pause control).</text>
